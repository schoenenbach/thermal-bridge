name: "ISO Case 1: Half Column"
description: |
  ISO 10211-2007 Annex A Test Case 1: 2D Half-Column
  
  Steady-state heat conduction in a 200mm x 400mm homogeneous medium.
  Thermal conductivity lambda = 0.1 W/(m*K).
  
  Boundary conditions:
  - Top: T = 20.0 °C
  - Right: T = 0.0 °C
  - Bottom: T = 0.0 °C
  - Left: Adiabatic (Natural symmetry)
  
  Validation:
  - Temperature at (150, 300)mm should be 5.25 °C ± 0.1K.

# Explicit Material Definitions
materials:
  - id: ISO_MEDIUM
    lambda: 0.1
    color: "#AAAAAA"
    description: "Homogeneous medium with lambda=0.1"
    solver_id: 100

canvas:
  bounds: [0, 200, 0, 400]
  grid: 1.0

boundary_conditions:
  dirichlet:
    top: 20.0
    right: 0.0
    bottom: 0.0
  adiabatic: [left]

measurements:
  point_probes:
    - name: "ISO Checkpoint"
      x: 150.0
      y: 300.0
      expected: 5.25
      tolerance: 0.1

elements:
  - type: rect
    name: "SolidColumn"
    material: ISO_MEDIUM
    params:
       x: 0.0
       y: 0.0
       width: 200.0
       height: 400.0

