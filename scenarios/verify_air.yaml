name: "Verification Air Visibility"
description: "Test scenario to verify air region visibility"

# Explicit Material Definitions
materials:
  - id: WALL
    lambda: 0.8
    color: "#AAAAAA"
  - id: AIR_INT
    lambda: 0.025
    color: "#FFFFFF"
  - id: AIR_EXT
    lambda: 0.025
    color: "#E0F7FA"

canvas:
  bounds: [0, 500, 0, 500]
  grid: 5.0

boundary_conditions:
  convective:
    internal: {T: 20.0, R: 0.13}
    external: {T: -5.0, R: 0.04}

elements:
  - type: air
    material: AIR_EXT
    params:
      name: "External_Air"
      x: 50
      y: 50
      width: 150
      height: 150
      type: "ext"
      
  - type: air
    material: AIR_INT
    params:
        name: "Internal_Air"
        x: 250
        y: 50
        width: 150
        height: 150
        type: "int"
        
  - type: wall
    material: WALL
    params:
        x: 50
        y: 250
        width: 350
        height: 50
