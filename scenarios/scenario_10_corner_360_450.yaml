name: "Scenario 10: Building Corner (360mm meets 450mm)"
description: "External Corner: Wall 360mm meets Wall 450mm. No Insulation."

variables:
  # Geometry Dimensions
  wall_thick_v: 450.0  # Vertical Wall Thickness
  wall_thick_h: 360.0  # Horizontal Wall Thickness
  arm_length: 1000.0   # Length of wall arms extensions
  
  # Coordinates
  # Inner Corner at (0,0) defines the Interior Origin
  x_inner: 0.0
  y_inner: 0.0
  
  # Outer Bounds (Negative coordinates)
  x_outer: -450.0      # -wall_thick_v
  y_outer: -360.0      # -wall_thick_h
  
  # Canvas Limits (padding around the 1000mm arms)
  x_min: -500.0        # x_outer - 50
  y_min: -400.0        # y_outer - 40
  x_max: 1000.0        # arm_length
  y_max: 1000.0        # arm_length
  
  # Calculated Dimensions for Rects
  # Vertical Wall Height = Top(1000) - Bottom(-360) = 1360
  wall_v_height: 1360.0 
  
  # Horizontal Wall Width = Right(1000) - Left(0) = 1000
  wall_h_width: 1000.0
  
canvas:
  bounds: ["${x_min}", "${x_max}", "${y_min}", "${y_max}"] 
  grid: 10.0

points:
  # Reference Points (optional, but good for debugging/schema)
  Inner_Corner: ["${x_inner}", "${y_inner}"]
  Outer_Corner: ["${x_outer}", "${y_outer}"]

elements:
  # Interior Air (Quadrant I)
  # Essential to define this as AIR_INT to set T=20
  - type: rect
    name: "Interior_Air"
    material: AIR_INT
    params:
       x: ${x_inner}
       y: ${y_inner}
       width: ${x_max}
       height: ${y_max}

  # Vertical Wall (The Main Post + Corner Overlap)
  # Covers [-450, 0] x [-360, 1000]
  - type: rect
    name: "Wall_Vertical"
    material: WALL
    params:
       x: ${x_outer}
       y: ${y_outer}
       width: ${wall_thick_v}
       height: ${wall_v_height}
       
  # Horizontal Wall (The Wing)
  # Covers [0, 1000] x [-360, 0]
  # Note: Starts at x=0 to abut the vertical wall, not overlap (cleaner)
  - type: rect
    name: "Wall_Horizontal"
    material: WALL
    params:
       x: ${x_inner}
       y: ${y_outer}
       width: ${wall_h_width}
       height: ${wall_thick_h}

boundary_conditions:
  # Cut-off boundaries should be adiabatic (symmetry/infinity assumption)
  adiabatic:
    - top
    - right
  
  # Exterior boundaries (left and bottom) will default to AIR_EXT temperature/surface resistance
  # inherited from the implicit AIR_EXT material filling the canvas margin.

measurements:
  surface_metrics:
    - { name: "MinT_Corner", type: min, boundary: internal, materials: [WALL] }
  
  point_probes:
    - { name: "T_InnerCorner", x: 0.0, y: 0.0 }
  
  derived:
    - { name: "fRsi", formula: frsi }
