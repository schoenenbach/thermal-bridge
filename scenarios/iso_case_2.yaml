name: "ISO Case 2: Multi-Material Bridge"
description: "ISO 10211 Test Case 2"

canvas:
  bounds: [0, 500, 0, 47.5]
  grid: 0.25

boundary_conditions:
  convective:
    bottom: { T: 20.0, R: 0.11 }
    top: { T: 0.0, R: 0.06 }
  adiabatic: [left, right]
  surface_resistance:
    204: 0.11 # MAT_AIR_INT
    205: 0.06 # MAT_AIR_EXT

refinement_zones:
  - x_min: 0.0
    x_max: 20.0
    y_min: 0.0
    y_max: 47.5
    target_dx: 0.25
    priority: 1

elements:
  # 1. Base Insulation
  - type: rect
    name: "InsulationBase"
    material: 200
    lambda: 0.029
    params:
       x: 0.0
       y: 0.0
       width: 500.0
       height: 47.5

  # 2. Concrete Top Layer
  - type: rect
    name: "ConcreteLayer"
    material: 201
    lambda: 1.15
    params:
       x: 0.0
       y: 41.5
       width: 500.0
       height: 6.0

  # 3. Wood Block
  - type: rect
    name: "WoodBlock"
    material: 202
    lambda: 0.12
    params:
       x: 0.0
       y: 36.5
       width: 15.0
       height: 5.0

  # 4. Aluminum Head
  - type: rect
    name: "AluminumHead"
    material: 203
    lambda: 230.0
    params:
       x: 0.0
       y: 35.0
       width: 15.0
       height: 1.5

  # 5. Aluminum Leg
  - type: rect
    name: "AluminumLeg"
    material: 203
    lambda: 230.0
    params:
       x: 0.0
       y: 1.5
       width: 1.5
       height: 33.5

  # 6. Aluminum Plate
  - type: rect
    name: "AluminumPlate"
    material: 203
    lambda: 230.0
    params:
       x: 0.0
       y: 0.0
       width: 500.0
       height: 1.5
