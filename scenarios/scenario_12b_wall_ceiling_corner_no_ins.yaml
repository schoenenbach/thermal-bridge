name: "Scenario 12b: Wall-Ceiling Corner (360mm, No Insulation) / Holzbalkendecke to Attic"
description: >
  Thermal bridge at junction where UNINSULATED exterior wall (360mm masonry, no ETICS)
  meets the ceiling (290mm Holzbalkendecke, U=1.14 W/m²K) transitioning to unheated attic (~5°C).
  Reference/IST scenario for comparison with Scenario 12 (insulated).

# Explicit Material Definitions
materials:
  - id: WALL
    lambda: 0.8
    color: "#AAAAAA"
    description: "360mm Masonry"
  - id: CEILING
    lambda: 0.428
    color: "#C4956A"
    description: "290mm Holzbalkendecke (effective lambda from U=1.14)"
  - id: ROOF_BUFFER
    lambda: 0.260
    color: "#8B6F47"
    description: "Equivalent attic+roof thermal resistance (R=0.768, gives ~5°C at ceiling top)"
  - id: AIR_INT
    lambda: 0.025
    color: "#FFFFFF"
  - id: AIR_EXT
    lambda: 0.025
    color: "#E0F7FA"

variables:
  # Geometry Dimensions
  wall_thick: 360.0 # Wall masonry thickness
  ceiling_thick: 290.0 # Holzbalkendecke thickness
  roof_thick: 200.0 # Equivalent roof buffer thickness
  arm_length: 1000.0 # Length of wall/ceiling arm extensions

  # Coordinate System
  x_inner: 0.0
  y_inner: 0.0

  # Wall extends left (negative x)
  x_wall_outer: -360.0 # -wall_thick

  # Vertical extents
  y_ceiling_top: 290.0 # ceiling_thick
  y_roof_top: 490.0 # ceiling_thick + roof_thick
  y_wall_bottom: -1000.0 # -arm_length

  # Ceiling arm extends to the right
  x_ceiling_right: 1000.0 # arm_length

  # Canvas bounds (with padding)
  x_min: -410.0 # x_wall_outer - 50
  x_max: 1000.0 # arm_length
  y_min: -1000.0 # -arm_length
  y_max: 540.0 # y_roof_top + 50

  # Calculated dimensions
  wall_full_height: 1490.0 # y_roof_top - y_wall_bottom
  ceiling_width: 1000.0
  roof_width: 1000.0

canvas:
  bounds: ["${x_min}", "${x_max}", "${y_min}", "${y_max}"]
  grid: 10.0

boundary_conditions:
  convective:
    internal: { T: 20.0, R: 0.13 }
    external: { T: -10.0, R: 0.04 }
  adiabatic:
    - bottom
    - right

points:
  Inner_Corner: ["${x_inner}", "${y_inner}"]
  Wall_Outer_Corner: ["${x_wall_outer}", "${y_inner}"]

elements:
  # Interior Air (Room)
  - type: rect
    name: "Interior_Air"
    material: AIR_INT
    params:
      x: ${x_inner}
      y: ${y_wall_bottom}
      width: ${x_ceiling_right}
      height: ${arm_length}

  # Wall (Masonry) - NO insulation
  - type: rect
    name: "Wall_Masonry"
    material: WALL
    params:
      x: ${x_wall_outer}
      y: ${y_wall_bottom}
      width: ${wall_thick}
      height: ${wall_full_height}

  # Ceiling (Holzbalkendecke)
  - type: rect
    name: "Ceiling_Holzbalkendecke"
    material: CEILING
    params:
      x: ${x_inner}
      y: ${y_inner}
      width: ${ceiling_width}
      height: ${ceiling_thick}

  # Roof Buffer (equivalent attic + roof thermal resistance)
  - type: rect
    name: "Roof_Buffer"
    material: ROOF_BUFFER
    params:
      x: ${x_inner}
      y: ${y_ceiling_top}
      width: ${roof_width}
      height: ${roof_thick}

measurements:
  surface_metrics:
    - {
        name: "MinT_Corner",
        type: min,
        boundary: internal,
        materials: [WALL, CEILING],
      }

  point_probes:
    - { name: "T_InnerCorner", x: 0.0, y: 0.0 }

  derived:
    - { name: "fRsi", formula: frsi }
