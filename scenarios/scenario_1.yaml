name: "Scenario 1: Wall 360mm (No Ins)"
description: "Reference Scenario: 360mm Wall, No Insulation"

# References: library/defaults.yaml (window_standard, wall_360mm)

variables:
  # Geometry Config
  wall_thick: 360.0
  win_pos: 150.0
  rebate_overlap: 50.0
  
  # Offsets
  off_x: 50.0
  off_y: 250.0
  
  # Canvas
  grid_size: 2.5
  
  # Derived (from wall_360mm preset)
  x_wall_int: 50.0
  x_wall_ext: 410.0  # 50+360
  x_win_outer: 260.0 # 410-150
  
  y_bottom: 0.0
  y_reveal: 250.0
  y_top: 500.0
  
  # Window details (from window_standard preset)
  f_depth: 70.0
  f_width: 70.0
  sash_overlap: 10.0
  sash_depth: 70.0
  sash_width: 70.0
  sash_recess: 30.0
  glass_thick: 24.0
  
  # Calculated window helpers
  x_f_start: 190.0  # 260-70
  
  y_sash_start: 310.0
  y_sash_end: 380.0
  x_sash_start: 160.0
  x_glass_start: 183.0
  
  # Reveal (no shift for no-insulation case)
  y_reveal_shifted: 250.0

canvas:
  bounds: [0, 500, 0, 500] 
  grid: ${grid_size}

measurements:
  surface_metrics:
    - { name: "MinT_Wall",  type: min, boundary: internal, materials: [WALL, INSULATION, REVEAL_INS, CONCRETE, WOOD] }
    - { name: "MinT_Frame", type: min, boundary: internal, materials: [FRAME] }
    - { name: "MinT_Glass", type: min, boundary: internal, materials: [GLASS] }
  
  derived:
    - { name: "Psi", formula: psi_value }
    - { name: "fRsi", formula: frsi }


points:
  AirInt_BL: [0.0, "${y_bottom}"]
  Wall_BL: ["${x_wall_int}", "${y_bottom}"]
  Wall_TL: ["${x_wall_int}", "${y_reveal}"]
  Frame_BL: ["${x_f_start}", "${y_reveal}"]
  Frame_Int_Step: ["${x_f_start}", "${y_sash_start}"]
  Sash_BL: ["${x_sash_start}", "${y_sash_start}"]
  Sash_TL: ["${x_sash_start}", "${y_sash_end}"]
  Sash_Glass_Step: ["${x_glass_start}", "${y_sash_end}"]
  Glass_TL: ["${x_glass_start}", "${y_top}"]
  AirInt_TopLeft: [0.0, "${y_top}"]

elements:
  - type: polygon
    name: "Interior Air Polygon"
    material: AIR_INT
    points: 
      - AirInt_BL
      - Wall_BL
      - Wall_TL
      - Frame_BL
      - Frame_Int_Step
      - Sash_BL
      - Sash_TL
      - Sash_Glass_Step
      - Glass_TL
      - AirInt_TopLeft

  # Wall (Interior Part)
  - type: wall
    params:
      x: ${x_wall_int}
      y: ${y_bottom}
      width: 210.0 # 260 - 50
      height: ${y_reveal}

  # Wall (Exterior/Reveal Part)
  - type: wall
    params:
      x: ${x_win_outer}
      y: ${y_bottom}
      width: 150.0 # 410 - 260 = 150
      height: ${y_reveal_shifted}

  # Rebate (on wall)
  - type: rect
    name: "Rebate"
    material: WALL
    params:
      x: ${x_win_outer}
      y: ${y_reveal_shifted}
      width: 150.0 
      height: ${rebate_overlap}

  # Window Assembly
  - type: window_detail
    params:
      x_frame_start: ${x_f_start}
      y_frame_start: ${y_reveal}
      frame_depth: ${f_depth}
      frame_width: ${f_width}
      sash_depth: ${sash_depth}
      sash_width: ${sash_width}
      sash_overlap: ${sash_overlap}
      sash_recess: ${sash_recess}
      glass_thickness: ${glass_thick}
      y_top: ${y_top}
      
  # Shutter Rails
  # Outer Alu
  - type: rect
    name: "ISG_Alu"
    material: ALUMINUM
    params:
       x: 260.0
       y: 303.0
       width: 22.0
       height: 53.0
       
  # Inner Cavity
  - type: rect
    name: "ISG_Air"
    material: CAVITY
    params:
       x: 262.0
       y: 305.0
       width: 18.0
       height: 49.0
       
  # Seal
  - type: rect
    name: "ISG_Seal"
    material: AIR_EXT
    lambda: 0.25
    params:
       x: 282.0
       y: 303.0
       width: 1.0
       height: 53.0
       
  # Shutter Rail
  - type: rect
    name: "Shutter_Alu"
    material: ALUMINUM
    params:
       x: 283.0
       y: 303.0
       width: 22.0
       height: 53.0
       
  - type: rect
    name: "Shutter_Air"
    material: CAVITY
    params:
       x: 285.0
       y: 305.0
       width: 18.0
       height: 49.0
