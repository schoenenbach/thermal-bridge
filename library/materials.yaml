# Materials Library
# Centralized material definitions for thermal simulations
# Reference these in scenarios instead of hardcoding lambda values

# --- Construction Materials ---
construction:
  MASONRY_1800:
    lambda: 0.81
    description: "Standard brick/masonry 1800kg/m³"
    material_id: WALL
    
  CONCRETE:
    lambda: 1.15
    description: "Standard concrete"
    material_id: CONCRETE
    
  WOOD:
    lambda: 0.12
    description: "Softwood"
    material_id: WOOD

# --- Insulation Materials ---
insulation:
  ETICS_WLS035:
    lambda: 0.035
    description: "ETICS insulation WLS 035"
    material_id: INSULATION
    
  ETICS_WLS032:
    lambda: 0.032
    description: "ETICS insulation WLS 032"
    material_id: INSULATION
    
  STYRODUR_XPS:
    lambda: 0.025
    description: "Styrodur / XPS WLS 025"
    material_id: STYRODUR
    
  REVEAL_INS_WLS035:
    lambda: 0.035
    description: "Reveal insulation WLS 035"
    material_id: REVEAL_INS

# --- Window Materials ---
window:
  # Frame - calculated from U-value to avoid double-counting surface resistance
  FRAME_UF13:
    # lambda = depth / (1/U - Rsi - Rse) = 0.07 / (1/1.3 - 0.13 - 0.04)
    lambda: 0.117
    description: "Frame equivalent, Uf=1.3 W/m²K, depth=70mm"
    u_value: 1.3
    depth_mm: 70
    material_id: FRAME
    
  # Glass - calculated from U-value
  GLASS_UG11:
    # lambda = thickness / (1/U - Rsi - Rse) = 0.024 / (1/1.1 - 0.13 - 0.04)
    lambda: 0.0325
    description: "Triple glazing equivalent, Ug=1.1 W/m²K, thickness=24mm"
    u_value: 1.1
    thickness_mm: 24
    material_id: GLASS

# --- Metal Materials ---
metals:
  ALUMINUM:
    lambda: 160.0
    description: "Aluminum profiles"
    material_id: ALUMINUM
    
  STEEL:
    lambda: 50.0
    description: "Steel profiles"
    material_id: FRAME  # Uses FRAME for coloring
    
  STAINLESS_STEEL:
    lambda: 15.0
    description: "Stainless steel (lower conductivity)"
    material_id: FRAME

# --- Spacers ---
spacers:
  SWISS_ULTIMATE:
    lambda: 0.14
    description: "Swisspacer Ultimate warm-edge spacer"
    
  STAINLESS_BOX:
    lambda: 0.60
    description: "Standard stainless steel box spacer"
    
  ALUMINUM_BOX:
    lambda: 10.0
    description: "Aluminum box spacer (poor thermal performance)"

# --- Air / Cavities ---
air_cavities:
  CAVITY_UNVENTILATED:
    lambda: 0.25
    description: "Unventilated air cavity equivalent (ISO 10077-2)"
    material_id: CAVITY
    
  EPDM:
    lambda: 0.25
    description: "EPDM gasket/seal"
    material_id: AIR_EXT

# --- ISO Test Materials (explicit lambda, numeric IDs) ---
iso_test:
  ISO_MEDIUM_01:
    lambda: 0.1
    id: 100
    description: "ISO 10211 Case 1 homogeneous medium"
    
  ISO_INSULATION_029:
    lambda: 0.029
    id: 200
    description: "ISO 10211 Case 2 insulation base"
    
  ISO_CONCRETE_115:
    lambda: 1.15
    id: 201
    description: "ISO 10211 Case 2 concrete layer"
    
  ISO_WOOD_012:
    lambda: 0.12
    id: 202
    description: "ISO 10211 Case 2 wood block"
    
  ISO_ALUMINUM_230:
    lambda: 230.0
    id: 203
    description: "ISO 10211 Case 2 aluminum stud"
