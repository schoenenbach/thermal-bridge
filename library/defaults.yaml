# Default Configurations Library
# Reusable configuration blocks for window scenarios
# Reference using: extends: window_base or measurements: $window_measurements

# --- Standard Measurements for Window Scenarios ---
window_measurements:
  surface_metrics:
    - { name: "MinT_Wall", type: min, boundary: internal, materials: [WALL, INSULATION, REVEAL_INS, CONCRETE, WOOD] }
    - { name: "MinT_Frame", type: min, boundary: internal, materials: [FRAME] }
    - { name: "MinT_Glass", type: min, boundary: internal, materials: [GLASS] }
  
  derived:
    - { name: "Psi", formula: psi_value }
    - { name: "fRsi", formula: frsi }

# --- Standard Window Dimensions ---
window_standard:
  # Fixed Frame
  f_depth: 70.0
  f_width: 70.0
  
  # Sash
  sash_overlap: 10.0
  sash_depth: 70.0
  sash_width: 70.0
  sash_recess: 30.0
  
  # Glass
  glass_thick: 24.0

# --- Common Offsets ---
offsets_standard:
  off_x: 50.0   # Interior air padding
  off_y: 250.0  # Reveal height

# --- Canvas Presets ---
canvas_presets:
  wall_360_no_ins:
    bounds: [0, 500, 0, 500]
    grid: 2.5
    
  wall_360_with_ins:
    bounds: [0, 660, 0, 500]
    grid: 2.5
    
  wall_450_no_ins:
    bounds: [0, 600, 0, 500]
    grid: 2.5
    
  wall_450_with_ins:
    bounds: [0, 750, 0, 500]
    grid: 2.5

# --- Common Vertical Coordinates ---
y_coords_standard:
  y_bottom: 0.0
  y_reveal: 250.0
  y_top: 500.0
  
  # Sash coords (derived from window_standard)
  y_sash_start: 310.0  # y_reveal + f_width - sash_overlap
  y_sash_end: 380.0    # y_sash_start + sash_width

# --- Wall Configurations ---
wall_360mm:
  wall_thick: 360.0
  x_wall_int: 50.0
  x_wall_ext: 410.0  # x_wall_int + wall_thick

wall_450mm:
  wall_thick: 450.0
  x_wall_int: 50.0
  x_wall_ext: 500.0  # x_wall_int + wall_thick

# --- Insulation Presets ---
insulation_tapered_200_100:
  ins_thick_max: 200.0
  ins_thick_min: 100.0
  taper_len: 150.0
  
insulation_none:
  ins_thick_max: 0.0
  ins_thick_min: 0.0
  taper_len: 0.0

# --- Reveal Insulation Presets ---
reveal_ins_30mm:
  reveal_ins_mm: 30.0
  reveal_shift: 30.0
  
reveal_ins_10mm:
  reveal_ins_mm: 10.0
  reveal_shift: 10.0
  
reveal_ins_none:
  reveal_ins_mm: 0.0
  reveal_shift: 0.0
